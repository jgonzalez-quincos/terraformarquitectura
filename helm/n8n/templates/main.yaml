apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-main
  labels:
    app: n8n
    component: main
spec:
  replicas: {{ .Values.main.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
      component: main
  template:
    metadata:
      labels:
        app: n8n
        component: main
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        {{- include "n8n.initContainer" . | nindent 8 }}
      containers:
        - name: n8n
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          args: ["start"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            {{- include "n8n.env" . | nindent 12 }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            {{- toYaml .Values.main.resources | nindent 12 }}
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-efs
