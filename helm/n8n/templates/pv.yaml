apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-efs
  labels:
    app: n8n
spec:
  capacity:
    storage: {{ .Values.efs.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: {{ .Values.efs.dnsName | quote }}
    path: /
