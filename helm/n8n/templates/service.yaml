apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: n8n
    component: main
spec:
  type: NodePort
  selector:
    app: n8n
    component: main
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      nodePort: {{ .Values.service.nodePort }}
